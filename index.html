    <!-- Apply a saved dark-theme choice before first paint so returning visitors don't see a light flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('l2ai-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
